<style>
/* Layout: brushed-steel card file. Black header strip with the logo, silver index tabs, cards filed in a grid; detail and edit open as a bottom sheet. */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --steel-1:#e4e6ea; --steel-2:#c6c9cf; --steel-3:#8d9199;
  --ink:#0d0e10; --muted:#5f636b; --line:#d6d8dc;
  --black:#0d0e10; --on-black:#eef0f2; --accent:#0d0e10; --on-accent:#ffffff;
  --danger:#b3261e; --ind-bg:#0d0e10; --ind-fg:#eef0f2;
  --metal:linear-gradient(135deg,#f7f8f9 0%,#d3d6da 45%,#eceef0 60%,#b9bdc3 100%);
  --shadow:0 1px 2px rgba(13,14,16,.06),0 8px 20px rgba(13,14,16,.07);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0c0e; --surface:#16181b; --steel-1:#22252a; --steel-2:#3a3e45; --steel-3:#8d9199;
  --ink:#eceef1; --muted:#9ca0a8; --line:#2a2d32;
  --black:#000000; --on-black:#eef0f2; --accent:#d9dce0; --on-accent:#0b0c0e;
  --danger:#f2867c; --ind-bg:#c6c9cf; --ind-fg:#0b0c0e;
  --metal:linear-gradient(135deg,#e9ebee 0%,#a9adb4 45%,#d4d7db 60%,#8c9097 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--black)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel-3);outline-offset:2px}

.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1040px;margin:0 auto}

/* black header strip */
.brand{background:var(--black);color:var(--on-black)}
.brand .inner{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand img{width:44px;height:44px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.brand h1{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:.08em;line-height:1.1}
.brand .sub{font-size:.8rem;color:#c6c9cf;letter-spacing:.06em;font-weight:500}
.brand .title{margin-right:auto}
.brand .count{font-family:var(--f-mono);font-size:.78rem;color:#c6c9cf;border:1px solid #3a3e45;border-radius:4px;padding:2px 8px}
.menu-btn{border:1px solid #3a3e45;background:transparent;color:var(--on-black);border-radius:8px;width:36px;height:36px;font-size:1.1rem;line-height:1}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--steel-1);color:var(--ink);padding:7px 13px;border-radius:8px 8px 0 0;font-size:.85rem;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--metal);color:#0d0e10;border-color:var(--steel-2);font-weight:700}
.tab .n{font-family:var(--f-mono);font-size:.72rem;opacity:.65;margin-left:5px}

main .inner{padding-block:16px 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bcard{display:grid;grid-template-columns:96px 1fr;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.bcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--metal)}
.bcard:hover{border-color:var(--steel-3)}
.thumb{width:96px;aspect-ratio:1.75/1;border-radius:4px;background:var(--steel-1);display:grid;place-items:center;color:var(--muted);font-size:.7rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.who{min-width:0}
.name{font-size:1.1rem;font-weight:700;line-height:1.3}
.role{color:var(--muted);font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role.en{font-size:.76rem;letter-spacing:.02em}
.line-id{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.72rem;padding:2px 7px;border-radius:4px;background:var(--steel-1);color:var(--ink)}
.chip.ind{background:var(--ind-bg);color:var(--ind-fg)}

.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty h2{margin:0;font-size:1rem;font-weight:500}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.tag{font-size:.7rem;font-family:var(--f-mono);color:var(--muted);letter-spacing:.08em}

.install{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.install p{margin:0;font-size:.88rem;flex:1;min-width:0}
.install b{font-weight:700}

.dock{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center}
.fab{border:1px solid #2a2d32;background:var(--black);color:var(--on-black);padding:14px 20px;border-radius:999px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
.fab.memo{background:var(--metal);color:#0d0e10;border-color:var(--steel-2)}
.fab.memo span{background:var(--black);color:var(--on-black)}
.inbox{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--steel-2);background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.inbox .num{font-family:var(--f-mono);font-weight:700;min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ind-bg);color:var(--ind-fg)}
.inbox .txt{flex:1;min-width:0}
.inbox .txt b{display:block}
.inbox .txt span{font-size:.8rem;color:var(--muted)}
.mic-wrap{display:grid;justify-items:center;gap:10px;padding-block:6px 4px}
.mic{width:96px;height:96px;border-radius:50%;border:1px solid var(--steel-2);background:var(--metal);color:#0d0e10;display:grid;place-items:center;box-shadow:var(--shadow)}
.mic svg{width:38px;height:38px}
.mic.on{background:var(--danger);color:#fff;border-color:var(--danger)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}50%{box-shadow:0 0 0 14px rgba(179,38,30,0)}}}
.mic-state{font-size:.88rem;color:var(--muted);text-align:center;min-height:1.4em}
.timer{font-family:var(--f-mono);font-size:.9rem}
.memo-item{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.memo-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.memo-meta .place{background:var(--steel-1);color:var(--ink);padding:1px 7px;border-radius:4px}
.memo-text{white-space:pre-wrap;overflow-wrap:anywhere}
.memo-item audio,.memo-ref audio{width:100%;height:36px}
.memo-ref{border:1px dashed var(--steel-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:.88rem}
.memo-ref .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.fab span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--metal);color:#0d0e10;font-weight:900}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (min-width:720px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%);bottom:4vh;border-radius:16px;max-height:90%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:1.3rem}
.x{border:0;background:var(--steel-1);width:34px;height:34px;border-radius:50%;font-size:1.1rem}
.photo-big{width:100%;aspect-ratio:1.75/1;object-fit:contain;background:var(--steel-1);border-radius:8px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:8px 12px;margin:14px 0 0}
.kv dt{color:var(--muted);font-size:.85rem}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono)}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 8px;font-size:.75rem;margin-left:6px}
.socials{display:flex;flex-direction:column;gap:4px}
.socials a{color:var(--ink);text-decoration-color:var(--steel-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:500;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.metal{background:var(--metal);color:#0d0e10;border-color:var(--steel-2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.confirm{margin-top:12px;padding:12px;border:1px solid var(--danger);border-radius:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
.preview{width:100%;aspect-ratio:1.75/1;border:1.5px dashed var(--steel-2);border-radius:8px;display:grid;place-items:center;color:var(--muted);overflow:hidden;background:var(--bg)}
.preview img{width:100%;height:100%;object-fit:contain}
.pick-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.soc-row{display:grid;grid-template-columns:7.5em 1fr 36px;gap:6px}
.soc-row select,.soc-row input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;font-size:16px}
.soc-row button{border:0;background:var(--steel-1);border-radius:8px}
.legend{font-size:.82rem;color:var(--muted);margin-bottom:-4px}
.hint{font-size:.8rem;color:var(--muted)}
.menu-list{display:grid;gap:10px}
.sec{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.sec:first-of-type{margin-top:4px}

    if(!has("cards"))d.createObjectStore("cards",{keyPath:"id"});if(!has("photos"))d.createObjectStore("photos");
    if(!has("memos"))d.createObjectStore("memos",{keyPath:"id"});if(!has("audio"))d.createObjectStore("audio")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const out=fn(t);t.oncomplete=()=>res(out?.result??out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

async function initCloud(){

    const [a,au,f]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);

async function startCloud(u){
  stopListeners();cloud={uid:u.uid,email:u.email||"",name:u.displayName||""};urls.forEach((v,k)=>dropURL(k));

async function migrateLocal(uid){

function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
async function shrink(blob,max,q){
  const img=await loadImg(blob);const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(b=>r(b),"image/jpeg",q));
}

    d.innerHTML=`<select aria-label="平台">${PLATFORMS.map(x=>`<option${x===p?" selected":""}>${x}</option>`).join("")}</select><input aria-label="帳號或網址" placeholder="帳號或網址" value="${esc(h)}" autocapitalize="off" autocomplete="off"><button type="button" aria-label="移除">×</button>`;
    d.querySelector("button").onclick=()=>d.remove();socList.appendChild(d);
  }
  (c.socials||[]).forEach(x=>socRow(x.platform,x.handle));
  if(!c.socials?.length)socRow();
  $("#addSoc").onclick=()=>socRow();
  async function onFile(e){
    const f=e.target.files?.[0];if(!f)return;
    try{pending=await shrink(f,1400,.8)}catch(err){toast("這張圖片讀不了，換一張試試");return}
    $("#pv").innerHTML=`<img src="${URL.createObjectURL(pending)}" alt="">`;
  }
  $("#fCam").onchange=onFile;$("#fPick").onchange=onFile;
  $("#cardForm").onsubmit=async e=>{
    e.preventDefault();
    const v=k=>$("#f_"+k).value.trim();
    const out={...c,name:v("name"),company:v("company"),companyEn:v("companyEn"),title:v("title"),industry:v("industry"),
      skills:v("skills").split(/[,，、\s]+/).filter(Boolean),
      lineId:v("lineId"),phone:v("phone"),email:v("email"),metAt:v("metAt"),notes:v("notes"),
      socials:[...socList.children].map(r=>({platform:r.querySelector("select").value,handle:r.querySelector("input").value.trim()})).filter(x=>x.handle),
      updatedAt:Date.now()};
    if(!out.name&&!out.company&&!out.companyEn&&!pending&&!out.hasPhoto){toast("至少填姓名或公司，或拍一張名片");return}
    const btn=$("#saveBtn");btn.disabled=true;btn.textContent="儲存中…";
    try{
      if(pending){await photoPut(out.id,pending);out.hasPhoto=true;dropURL(out.id)}
      await dbPut(out);if(fromMemo)await memoDel(fromMemo.id);closeSheet();await reload();toast(fromMemo?"已整理成名片":isNew?"已新增":"已更新");
    }catch(err){btn.disabled=false;btn.textContent="儲存";toast("儲存失敗，手機空間可能不足")}
  };
}


/* ---------- quick voice memo ---------- */
function fmtTime(t){if(!t)return"";const d=new Date(t),n=new Date();const hm=d.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  return d.toDateString()===n.toDateString()?"今天 "+hm:`${d.getMonth()+1}/${d.getDate()} ${hm}`}
function lastPlace(){try{const v=JSON.parse(localStorage.getItem("cardbox.place")||"null");if(v&&Date.now()-v.t<12*3600e3)return v.p}catch(e){}return""}
function savePlace(p){try{localStorage.setItem("cardbox.place",JSON.stringify({p,t:Date.now()}))}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>';
const STOP_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

function showMemo(){
  let rec=null, mr=null, chunks=[], audioBlob=null, mode=SR?"speech":"audio", running=false, t0=0, tick=null, base="";
  openSheet(`<div class="sheet-head"><h2>口述速記</h2><button class="x" type="button" data-close aria-label="關閉">×</button></div>
  <div class="mic-wrap">
    <button class="mic" id="micBtn" type="button" aria-label="開始口述">${MIC_SVG}</button>
    <div class="mic-state" id="micState">點麥克風開始說，例如：「王小明，台積電工程師，賴 ID wang123，喜歡攝影」</div>
  </div>
  <form id="memoForm" novalidate style="margin-top:8px">
    <label class="f">內容（可以直接打字，或用鍵盤上的麥克風輸入）<textarea id="m_text" rows="5" placeholder="說的內容會出現在這裡"></textarea></label>
    <div id="m_audio"></div>
    <label class="f">場合<input id="m_place" value="${esc(lastPlace())}" placeholder="例如：中興大學創業週" autocomplete="off"></label>
    <div class="actions"><button class="btn primary" type="submit" id="m_save">存到待整理</button><button class="btn" type="button" data-close>取消</button></div>
  </form>`);
  const micBtn=$("#micBtn"), st=$("#micState"), ta=$("#m_text");
  const setState=(on,msg)=>{running=on;micBtn.classList.toggle("on",on);micBtn.innerHTML=on?STOP_SVG:MIC_SVG;micBtn.setAttribute("aria-label",on?"停止":"開始口述");if(msg!=null)st.innerHTML=msg};
  const startTimer=()=>{t0=Date.now();clearInterval(tick);tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);const el=$("#tm");if(el)el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},500)};
  async function startAudio(note){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];mr=new MediaRecorder(stream);
      mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());audioBlob=new Blob(chunks,{type:mr.mimeType||"audio/mp4"});
        $("#m_audio").innerHTML=`<audio controls src="${URL.createObjectURL(audioBlob)}"></audio>`;setState(false,"錄好了，會連同錄音一起存。有空再聽著整理。")};
      mr.start();startTimer();setState(true,`${note||""}錄音中 <span class="timer" id="tm">0:00</span>　說完點一下停止`);
    }catch(e){setState(false,"無法使用麥克風。請到手機設定允許瀏覽器使用麥克風，或直接用鍵盤輸入。")}
  }
  function startSpeech(){
    rec=new SR();rec.lang="zh-TW";rec.continuous=true;rec.interimResults=true;
    base=ta.value?ta.value.replace(/\s*$/,"")+"\n":"";let finalTxt="";
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalTxt+=r[0].transcript+"，";else interim+=r[0].transcript}
      ta.value=base+finalTxt+interim};
    rec.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture","network","language-not-supported"].includes(e.error)){rec.onend=null;mode="audio";startAudio("這支手機不支援語音轉文字，改成")}};
    rec.onend=()=>{if(running&&mode==="speech"){try{rec.start();return}catch(e){}}if(mode==="speech")setState(false,"已轉成文字，請看一下有沒有聽錯再存。")};
    try{rec.start();setState(true,"聆聽中… 說完點一下停止")}catch(e){mode="audio";startAudio()}
  }
  micBtn.onclick=()=>{
    if(running){running=false;clearInterval(tick);if(mode==="speech"&&rec){rec.stop()}else if(mr&&mr.state!=="inactive"){mr.stop()}return}
    if(mode==="speech")startSpeech();else startAudio();
  };
  const stopAll=()=>{running=false;clearInterval(tick);try{rec&&rec.abort()}catch(e){}try{mr&&mr.state!=="inactive"&&mr.stop()}catch(e){}};
  $("#sheet").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",stopAll));
  $("#memoForm").onsubmit=async e=>{
    e.preventDefault();
    if(running){micBtn.click();await new Promise(r=>setTimeout(r,500))}
    const text=ta.value.trim(), place=$("#m_place").value.trim();
    if(!text&&!audioBlob){toast("還沒有內容，先說幾句或打幾個字");return}
    const m={id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text,place,createdAt:Date.now(),hasAudio:!!audioBlob};
    try{if(audioBlob)await audioPut(m.id,audioBlob);await memoPut(m);if(place)savePlace(place);closeSheet();await reload();toast("已存到待整理")}
    catch(err){toast("儲存失敗，手機空間可能不足")}
  };
}

/* pull likely fields out of spoken text */
function cnDigits(s){const map={"零":"0","〇":"0","一":"1","么":"1","二":"2","兩":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9"};
  return s.replace(/[零〇一么二兩三四五六七八九]{4,}/g,m=>[...m].map(c=>map[c]).join(""))}
function parseMemo(raw){
  const t=cnDigits(raw||""); const out={socials:[],skills:[]};
  const phone=t.match(/(?:\+?886[-\s]?|0)9\d{2}[-\s]?\d{3}[-\s]?\d{3}/);if(phone)out.phone=phone[0].replace(/\s/g,"");
  const mail=t.replace(/\s*(小老鼠|at)\s*/gi,"@").replace(/\s*(點|dot)\s*(?=com|tw|net|org|edu)/gi,".").match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(mail)out.email=mail[0];
  const line=t.match(/(?:賴|LINE|line|Line)\s*(?:ID|id|帳號)?\s*(?:是|：|:)?\s*@?([A-Za-z0-9._-]{3,})/);if(line)out.lineId=line[1];
  const ig=t.match(/(?:IG|ig|Instagram|instagram)\s*(?:帳號)?\s*(?:是|：|:)?\s*@?([A-Za-z0-9._]{2,})/);if(ig)out.socials.push({platform:"Instagram",handle:ig[1]});
  const fb=t.match(/(?:FB|fb|臉書|Facebook)\s*(?:是|：|:)?\s*([A-Za-z0-9._]{3,})/);if(fb)out.socials.push({platform:"Facebook",handle:fb[1]});
  const th=t.match(/(?:Threads|threads|脆)\s*(?:是|：|:)?\s*@?([A-Za-z0-9._]{2,})/);if(th)out.socials.push({platform:"Threads",handle:th[1]});
  const name=t.match(/(?:他叫|她叫|叫做|名字是|名字叫|姓名)\s*([一-龥]{2,4})/)||t.match(/^\s*([一-龥]{2,3})[，,、\s]/);if(name)out.name=name[1];
  const sk=t.match(/(?:專長|擅長|會做|技能)(?:是)?\s*([^。\n]{2,40})/);if(sk)out.skills=sk[1].split(/[,，、和跟及\s]+/).map(x=>x.trim()).filter(x=>x&&x.length<=12).slice(0,5);
  const kw=[["科技／軟體",/工程師|軟體|程式|AI|網頁|App|資訊/],["製造／電子",/半導體|電子|製造|工廠|台積電|鴻海/],["金融／保險",/銀行|保險|證券|投資|理財|金融/],["行銷／廣告",/行銷|廣告|公關|社群經營/],["設計／創意",/設計|插畫|攝影|影片|創意/],["餐飲／食品",/餐廳|咖啡|餐飲|食品|烘焙/],["零售／電商",/電商|零售|門市|超市/],["教育",/老師|教授|補習|教育|講師/],["醫療／健康",/醫生|護理|醫院|診所|藥師|健身|物理治療/],["不動產／建築",/房仲|建築|不動產|室內設計|建設/],["法律／會計",/律師|會計|法務|記帳/],["政府／公部門",/公務|政府|市府|公所/],["學生／學術",/學生|研究生|大學|碩士|博士/]];
  for(const [k,re] of kw)if(re.test(t)){out.industry=k;break}
  return out;
}
function showInbox(){
  if(!memos.length){closeSheet();return}
  openSheet(`<div class="sheet-head"><h2>待整理的速記</h2><button class="x" type="button" data-close aria-label="關閉">×</button></div>
  <div style="display:grid;gap:10px">${memos.map(m=>`<div class="memo-item" data-mid="${esc(m.id)}">
    <div class="memo-meta"><span>${esc(fmtTime(m.createdAt))}</span>${m.place?`<span class="place">${esc(m.place)}</span>`:""}${m.hasAudio?"<span>有錄音</span>":""}</div>
    ${m.text?`<div class="memo-text">${esc(m.text)}</div>`:""}
    <div class="audio-slot"></div>
    <div class="actions" style="margin-top:0"><button class="btn primary" type="button" data-conv>整理成名片</button><button class="btn danger" type="button" data-mdel>刪除</button></div>
  </div>`).join("")}</div>`);
  $("#sheet").querySelectorAll(".memo-item").forEach(async el=>{
    const m=memos.find(x=>x.id===el.dataset.mid);
    if(m.hasAudio){const b=await audioGet(m.id);if(b)el.querySelector(".audio-slot").innerHTML=`<audio controls preload="metadata" src="${URL.createObjectURL(b)}"></audio>`}
    el.querySelector("[data-conv]").onclick=()=>{const p=parseMemo(m.text);p.metAt=m.place||"";p.notes=m.text||"";showForm(null,m,p)};
    const del=el.querySelector("[data-mdel]");
    del.onclick=async()=>{if(del.dataset.armed){await memoDel(m.id);await reload();showInbox();toast("已刪除速記")}else{del.dataset.armed="1";del.textContent="再按一次確認刪除"}};
  });
}

/* ---------- backup ---------- */
function blobToDataURL(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
async function dataURLToBlob(u){return (await fetch(u)).blob()}
async function exportBackup(){
  const out={app:"cardbox",version:1,exportedAt:new Date().toISOString(),cards:[]};
  for(const c of cards){const p=c.hasPhoto?await photoGet(c.id):null;out.cards.push({...c,photo:p?await blobToDataURL(p):null})}
  out.memos=[];for(const m of memos){const a=m.hasAudio?await audioGet(m.id):null;out.memos.push({...m,audio:a?await blobToDataURL(a):null})}
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const name=`CardBox備份-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("備份檔已下載");
}
async function importBackup(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast("這不是名片盒的備份檔");return}
  if(data?.app!=="cardbox"||!Array.isArray(data.cards)){toast("這不是名片盒的備份檔");return}
  let n=0;
  for(const raw of data.cards){const{photo,...c}=raw;if(!c.id)continue;
    if(photo){try{await photoPut(c.id,await dataURLToBlob(photo));c.hasPhoto=true;dropURL(c.id)}catch(e){c.hasPhoto=false}}
    await dbPut(c);n++}
  for(const raw of (Array.isArray(data.memos)?data.memos:[])){const{audio,...m}=raw;if(!m.id)continue;
    if(audio){try{await audioPut(m.id,await dataURLToBlob(audio));m.hasAudio=true}catch(e){m.hasAudio=false}}
    await memoPut(m)}
  closeSheet();await reload();toast(`已匯入 ${n} 張名片`);
}
async function exportCSV(){
  const cols=[["姓名","name"],["公司","company"],["公司英文名","companyEn"],["職稱","title"],["產業","industry"],["專長",c=>(c.skills||[]).join("、")],["賴ID","lineId"],["電話","phone"],["Email","email"],["社群",c=>(c.socials||[]).map(s=>s.platform+":"+s.handle).join(" | ")],["認識於","metAt"],["備註","notes"]];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[cols.map(c=>q(c[0])).join(",")].concat(cards.map(c=>cols.map(([,k])=>q(typeof k==="function"?k(c):c[k])).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"});
  const name=`名片清單-${new Date().toISOString().slice(0,10)}.csv`;
  const file=new File([blob],name,{type:"text/csv"});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function showMenu(){
  openSheet(`<div class="sheet-head"><h2>同步與備份</h2><button class="x" type="button" data-close aria-label="關閉">×</button></div>
  <h3 class="sec">雲端同步</h3>
  ${syncSection()}
  <h3 class="sec">備份與匯出</h3>
  <p class="hint" style="margin-top:0">${cloud?"已經存在雲端，備份檔是額外保險。":"沒登入時，名片只存在這台裝置。換裝置或清除瀏覽器資料前，記得先備份。"}</p>
  <div class="menu-list">
    <button class="btn primary" type="button" id="mExport">備份全部名片（含照片）</button>
    <span class="btn filebtn">從備份檔還原<input id="mImport" type="file" accept="application/json,.json" aria-label="從備份檔還原"></span>
    <button class="btn" type="button" id="mCSV">匯出成 Excel 可開的 CSV</button>
  </div>
  <p class="hint">目前共 ${cards.length} 張名片、${memos.length} 則待整理速記。備份會一起存。</p>`);
  wireSync();$("#mExport").onclick=exportBackup;$("#mCSV").onclick=exportCSV;
  $("#mImport").onchange=e=>{const f=e.target.files?.[0];if(f)importBackup(f)};
}

/* ---------- install tip ---------- */
let deferredPrompt=null;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function dismissed(){try{return localStorage.getItem("cardbox.tipOff")==="1"}catch(e){return false}}
function hideTip(){$("#installTip").hidden=true;try{localStorage.setItem("cardbox.tipOff","1")}catch(e){}}
function showTip(html){if(standalone||dismissed())return;const t=$("#installTip");t.innerHTML=`<p>${html}</p><button class="x" type="button" aria-label="不再顯示">×</button>`;t.hidden=false;t.querySelector(".x").onclick=hideTip}
if(/iphone|ipad|ipod/i.test(navigator.userAgent))showTip("加到主畫面：點 Safari 下方的 <b>分享</b> 按鈕，再選 <b>加入主畫面</b>。");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;
  showTip(`把名片盒 CardBox 裝到手機桌面，開起來就像一般 App。 <button class="btn primary" type="button" id="doInstall" style="margin-top:8px">安裝到桌面</button>`);
  const b=$("#doInstall");if(b)b.onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;hideTip()}});

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest(".tab");if(t){filter=t.dataset.f;render();return}

$("#q").addEventListener("input",e=>{query=e.target.value.trim();render()});
$("#addBtn").onclick=()=>showForm(null);
$("#memoBtn").onclick=showMemo;

(async()=>{
  try{idb=await openDB();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});if(!cloud)await reload()}
  catch(e){$("#grid").innerHTML=`<p class="hint">這個瀏覽器無法儲存資料（可能是無痕模式）。請用一般模式開啟。</p>`}
  setSyncLabel();initCloud();
})();
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
